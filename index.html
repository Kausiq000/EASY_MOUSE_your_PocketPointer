<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Mouse - Turn Your Phone into a Wireless Mouse</title>
  <meta name="description" content="Turn your smartphone into a wireless mouse and trackpad controller for laptops and PCs. Instant pairing, multi-touch gestures, zero extra hardware.">
  <meta name="theme-color" content="#08090b">

  <style>
    /* -------------------------------------------------------------
       EASY MOUSE DESIGN SYSTEM TOKENS
       Industrial Dark-Tech Palette with Laser Crimson Highlights
       ------------------------------------------------------------- */
    :root {
      --bg-canvas: #08090b;
      --bg-surface: #0e1015;
      --bg-elevated: #141720;
      --bg-panel: #181d27;
      --bg-panel-hover: #1f2532;
      
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-focus: rgba(255, 42, 75, 0.6);
      
      --accent-red: #ff2a4b;
      --accent-red-hover: #ff4765;
      --accent-red-glow: rgba(255, 42, 75, 0.25);
      --accent-red-dim: rgba(255, 42, 75, 0.12);
      --accent-red-ring: rgba(255, 42, 75, 0.4);
      
      --text-primary: #f4f5f7;
      --text-secondary: #9aa2b1;
      --text-muted: #5e6677;
      --text-white: #ffffff;
      
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SF Mono", "Segoe UI Mono", "Roboto Mono", "Cascadia Code", "Courier New", monospace;
      
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 9999px;
      
      --max-width: 1200px;
      --nav-height: 64px;
      --transition-fast: 0.18s ease;
      --transition-normal: 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* -------------------------------------------------------------
       CSS RESET & BASE TYPOGRAPHY
       ------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle technical grid background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* Top ambient red illumination */
    body::after {
      content: "";
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 450px;
      background: radial-gradient(ellipse at center, rgba(255, 42, 75, 0.08) 0%, rgba(255, 42, 75, 0.02) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--text-primary);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      max-width: 60ch;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    /* Accessibility focus styling */
    :focus-visible {
      outline: 2px solid var(--accent-red);
      outline-offset: 3px;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin-left: auto;
      margin-right: auto;
      padding-left: 24px;
      padding-right: 24px;
      position: relative;
      z-index: 1;
    }

    .section-spacing {
      padding-top: 100px;
      padding-bottom: 100px;
    }

    @media (max-width: 768px) {
      .section-spacing {
        padding-top: 64px;
        padding-bottom: 64px;
      }
      .container {
        padding-left: 18px;
        padding-right: 18px;
      }
    }

    /* -------------------------------------------------------------
       PREFERS-REDUCED-MOTION
       ------------------------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header will be mounted in Task 2 -->
    <main id="main-content">
      <!-- Sections will be mounted in Tasks 3-7 -->
    </main>
  </div>
</body>
</html>
